name: Build KernelNet

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Force Rewrite Project Version and Disable Glob Checks
      shell: bash
      run: |
        mkdir -p src/game
        mkdir -p cmake
        mkdir -p other/versioninfo
        mkdir -p other/manifest
        echo '#define GAME_VERSION "0.0.1"' > src/game/version.h
        echo '#define GAME_RELEASE_VERSION "0.0.1"' >> src/game/version.h
        touch cmake/checksummed_extra.txt
        touch other/versioninfo/versioninfo.rc.in
        touch other/manifest/client.manifest.in
        
        # Переписываем строчку project
        sed -i 's/project(.*)/project(DDNet VERSION "0.0.1" LANGUAGES C CXX)/g' CMakeLists.txt
        
        # Отключаем проверки версий
        sed -i 's/message(FATAL_ERROR "Couldn\x27t parse version from src\/game\/version.h")/message(STATUS "Skipping version check")/' CMakeLists.txt
        sed -i 's/message(SEND_ERROR "Couldn\x27t parse version from src\/game\/version.h")/message(STATUS "Skipping version check")/' CMakeLists.txt
        sed -i 's/message(FATAL_ERROR "Couldn\x27t parse TClient version from src\/game\/version.h")/message(STATUS "Skipping tclient check")/' CMakeLists.txt
        sed -i 's/message(SEND_ERROR "Couldn\x27t parse TClient version from src\/game\/version.h")/message(STATUS "Skipping tclient check")/' CMakeLists.txt
        
        # Ломаем проверку set_glob, которая не дает собраться из-за кастомных файлов KernelNet
        sed -i 's/message(FATAL_ERROR "${FILE_DIR} does not contain every file from directory ${DIR}")/message(STATUS "Skipping glob validation")/' CMakeLists.txt
        sed -i 's/message(SEND_ERROR "${FILE_DIR} does not contain every file from directory ${DIR}")/message(STATUS "Skipping glob validation")/' CMakeLists.txt
        sed -i 's/message(FATAL_ERROR "Entries only present in ${FILE_DIR}: ${ONLY_GLOB}")/message(STATUS "Skipping glob validation")/' CMakeLists.txt
        sed -i 's/message(SEND_ERROR "Entries only present in ${FILE_DIR}: ${ONLY_GLOB}")/message(STATUS "Skipping glob validation")/' CMakeLists.txt

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DSERVER=OFF -DCLIENT=ON -DDOWNLOAD_BUNDLED=ON -DUPDATE_BUNDLED=ON

    - name: Build Game
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Finished Game
      uses: actions/upload-artifact@v4
      with:
        name: KernelNet-Windows-Build
        path: build/Release/
