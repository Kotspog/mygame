name: Build KernelNet

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clone Prebuilt DDNet Libraries
      shell: bash
      run: git clone --depth 1 https://github.com ddnet-libs

    - name: Force Rewrite Project Version and Missing Files
      shell: bash
      run: |
        mkdir -p src/game
        mkdir -p cmake
        mkdir -p other/versioninfo
        mkdir -p other/manifest
        echo '#define GAME_VERSION "0.0.1"' > src/game/version.h
        echo '#define GAME_RELEASE_VERSION "0.0.1"' >> src/game/version.h
        touch cmake/checksummed_extra.txt
        touch other/versioninfo/versioninfo.rc.in
        touch other/manifest/client.manifest.in
        touch cmake/Download_GTest_CMakeLists.txt.in
        sed -i 's/project(.*)/project(DDNet VERSION "0.0.1" LANGUAGES C CXX)/g' CMakeLists.txt
        sed -i '/macro(set_glob/,/endmacro()/c\macro(set_glob)\nendmacro()' CMakeLists.txt
        sed -i '/function(set_glob/,/endfunction()/c\function(set_glob)\nendfunction()' CMakeLists.txt
        sed -i 's/install(TARGETS config_retrieve/# install(TARGETS config_retrieve/g' CMakeLists.txt

    - name: Configure CMake
      shell: bash
      run: |
        mkdir build
        cd build
        LIB_PATH="$(pwd)/../ddnet-libs/windows/x86_64"
        cmake .. -DSERVER=OFF -DCLIENT=ON -DCMAKE_PREFIX_PATH="$LIB_PATH" -DCMAKE_LIBRARY_PATH="$LIB_PATH/lib" -DCMAKE_INCLUDE_PATH="$LIB_PATH/include"

    - name: Build Game
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Finished Game
      uses: actions/upload-artifact@v4
      with:
        name: KernelNet-Windows-Build
        path: build/Release/
